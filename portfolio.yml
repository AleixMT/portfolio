  projects:
    - name: Justicier
      url: https://github.com/ICIQ-DMP/Justicier
      description: Microsoft-cloud-native automation that pulls HR documents from SharePoint and extracts the relevant payroll pages for a given employee and period.
      startDate: Sep 2025
      endDate:
      summary: |
        - Employees submit requests via Microsoft Forms; a Microsoft List is the source of truth for execution parameters
        - New requests trigger Power Automate, which runs a Microsoft Approvals workflow for authorized HR personnel to sign off each request
        - On approval, an on-premises Jenkins instance behind an NGINX firewall triggers the Python job that retrieves the documents from the HR SharePoints and cuts the relevant pages
        - When the job finishes the requester gets an email and the output is uploaded to their private SharePoint / OneDrive folder; the OneDrive client for Linux keeps inputs and outputs in sync
        - Packaged as Docker images and shipped through GitHub Actions and Jenkins pipelines
        - "Justicier Massiu" builds on top of it, accepting an Excel that lists many Justicier requests at once for bulk operations
        - Documentation: https://iciq-dmp.github.io/justicier-docs/
      keywords:
        - Python
        - Bash
        - Docker
        - Jenkins
        - GitHub Actions
        - NGINX
        - Power Automate
        - SharePoint
    - name: Justifactu
      url: https://github.com/ICIQ-DMP/justifactu
      description: Microsoft-cloud-native automation that periodically curates ICIQ billing documents, merging each invoice with its bank proof and archiving it into the units' accounting spreadsheets.
      startDate: Nov 2025
      endDate:
      summary: |
        - Microsoft-cloud-native application that runs a periodic workflow and also reacts to new input documents being uploaded
        - Core operation merges each invoice with its corresponding bank proof
        - Then archives the merged documents against the accounting (economical) spreadsheets of every unit
        - Packaged with Docker and a Makefile-driven build; documentation at https://iciq-dmp.github.io/justifactu-docs/
      keywords:
        - Python
        - Docker
        - Make
        - Power Automate
        - SharePoint
        - Document Processing
    - name: imarina-load-researchers
      url: https://github.com/ICIQ-DMP/imarina-load-researchers
      description: Microsoft-cloud-native automation that builds the researcher-update spreadsheet for the iMarina iPublic CRIS from the previous load and an A3 database snapshot.
      startDate: Nov 2025
      endDate:
      summary: |
        - Generates the spreadsheet used to update researchers in iMarina (a CRIS — Current Research Information System) from the last load plus a bulk export of ICIQ personnel from the A3 database
        - Removes researchers who have left, updates those who changed positions within ICIQ and adds new ICIQ researchers
        - Runs translation, standardization and curation checks over the data before upload
        - Triggered from Microsoft Forms; Power Automate then asks the iMarina admin to run the Python code, which uploads the result to the iMarina server over SFTP
        - Shares most of its tooling with Justicier, adapted to this problem
        - Documentation: https://iciq-dmp.github.io/imarina-load-researchers-docs
      keywords:
        - Python
        - Docker
        - Power Automate
        - SharePoint
        - SFTP
        - ETL
        - CRIS
