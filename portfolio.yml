# Top-level locale setting — switch to 'es' to render in Spanish.
# Catalan ('ca') keys are stored above but require adding 'ca' to the
# supported locale list in the tool before it can be selected here.
locale:
  # Use `yamlresume languages list` to get the list of supported languages
  language: en

# Multiple output layouts configuration
layouts:
  - engine: latex
    page:
      margins:
        top: 2.5cm
        left: 1.5cm
        right: 1.5cm
        bottom: 2.5cm
      showPageNumbers: true
    # Use `yamlresume templates list` to get the list of available templates
    template: moderncv-banking
    typography:
      # LaTeX engine only supports 10pt, 11pt, and 12pt
      fontSize: 11pt
  - engine: markdown
  - engine: html
    # Use `yamlresume templates list` to get the list of available templates
    template: calm
    typography:
      # HTML engine only supports font size in px unit, from 10px to 24px
      fontSize: 16px
