name: Build Resume

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build resume
        id: build
        uses: yamlresume/action@v0.2.2
        with:
          resumes: |
            portfolio.yml
          verbose: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: portfolio
          path: |
            *.pdf
            *.tex
            *.html
          if-no-files-found: error
